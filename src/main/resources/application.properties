spring.datasource.url=${DB_URL:jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=8080
app.security.admin.username=${ADMIN_USER:admin}
app.security.admin.password=${ADMIN_PASS:admin123}
app.security.staff.username=${STAFF_USER:staff}
app.security.staff.password=${STAFF_PASS:staff123}
