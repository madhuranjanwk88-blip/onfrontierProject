# In-memory database for local development and demos. Nothing to install;
# data is discarded when the app stops.
spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
