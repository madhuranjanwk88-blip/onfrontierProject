# Shared configuration. Database settings live in the profile-specific files:
#   application-postgres.properties (default)
#   application-h2.properties       (run with -Dspring-boot.run.profiles=h2)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=8080

# Let the handler for NoHandlerFoundException return a JSON 404 instead of the default error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
